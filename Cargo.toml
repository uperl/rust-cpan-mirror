[package]
name = "cpan-mirror"
version = "0.1.1"
edition = "2024"
description = "An interface to a CPAN mirror: resolve a Perl module name to its distribution and fetch the tarball"
repository = "https://github.com/uperl/rust-cpan-mirror"
license = "MIT"
readme = "README.md"

[lib]
name = "cpan_mirror"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
url = "2.5"
ureq = "2"
suppaftp = "6"
cpan-packagedetails = { git = "https://github.com/uperl/rust-cpan-packagedetails" }

[dev-dependencies]
anyhow = "1"
